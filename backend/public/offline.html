<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Nextel Connect</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #18443E; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               text-align: center; padding: 24px; }
        .card { max-width: 340px; }
        img { width: 150px; height: auto; margin-bottom: 26px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; opacity: .82; line-height: 1.55; margin: 0 0 22px; }
        button { background: #fff; color: #18443E; border: 0; border-radius: 999px;
                 padding: 12px 26px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/public/logo-light.png" alt="Nextel Connect">
        <h1>You're offline</h1>
        <p>We couldn't reach Nextel Connect. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
