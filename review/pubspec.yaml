name: review
description: "TL Store application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.3
  flutter_secure_storage: ^10.3.1

  cupertino_icons: ^1.0.8
  file_picker: 9.2.3
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  share_plus: ^11.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: 19.5.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_facebook_auth: ^7.2.0
  flutter_advanced_drawer: ^1.5.0
  flutter_svg: ^2.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.26

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#145A3D"
  image: assets/native-splash.png
  android_12:
    color: "#145A3D"
    image: assets/native-splash.png
    icon_background_color: "#145A3D"

flutter:

  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/cards/
    - assets/native-splash.png
    - assets/splash-bg.png
    - assets/intro-bg.png
    - assets/intro1.svg
    - assets/intro2.svg
    - assets/intro3.svg
